paths:
  /admin/verify-password-hash:
    post:
      tags:
        - Admin - Admin Management
      summary: Verify Password Hash
      description: "Verify Password Hash (Public - for debugging/testing)\n\n\n📋 Request Body Fields:\n• password: string (required)\n• password_hash: string (required)"
      operationId: post_admin_verify-password-hash
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
        400:
          description: Bad request
        401:
          description: Unauthorized
        404:
          description: Not found
        500:
          description: Internal server error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                password_hash:
                  type: string
              required:
                - password
                - password_hash
            example:
              password: sample_string
              password_hash: sample_string
  /admin/login:
    post:
      tags:
        - Admin - Admin Management
      summary: Admin Login
      description: "Admin Login (Public)\n\n\n📋 Request Body Fields:\n• email: string (required)\n• password: string (required)"
      operationId: post_admin_login
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
        400:
          description: Bad request
        401:
          description: Unauthorized
        404:
          description: Not found
        500:
          description: Internal server error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required:
                - email
                - password
            example:
              email: user@example.com
              password: sample_string
  /admin/setup/create-superadmin:
    post:
      tags:
        - Admin - Admin Management
      summary: Create Initial Super Admin
      description: "Create Initial Super Admin (Public - No Auth Required)\n\n\n📋 Request Body Fields:\n• username: string (required)\n• email: string (required)\n• password: string (required)\n• phone_number: string (optional)\n• admin_role: string (required)"
      operationId: post_admin_setup_create-superadmin
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
        400:
          description: Bad request
        401:
          description: Unauthorized
        404:
          description: Not found
        500:
          description: Internal server error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  minimum: 3
                  maximum: 100
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minimum: 8
                  pattern: ^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$
                phone_number:
                  type: string
                  pattern: ^[+]?[0-9]{10,15}$
                admin_role:
                  type: string
                  enum:
                    - admin
                    - superadmin
              required:
                - username
                - email
                - password
                - admin_role
            example:
              username: John Doe
              email: user@example.com
              password: sample_string
              phone_number: +919876543210
              admin_role: admin
