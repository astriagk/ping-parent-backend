  /admin/auth/verify-password-hash:
    post:
      tags:
        - Admin
      summary: Create Verify Password Hash
      description: "\n\n🔐 Requires Admin authentication\n\n\n📋 Request Body Fields:\n• password: string (required)\n• password_hash: string (required)"
      operationId: post_admin_auth_verify-password-hash
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
        400:
          description: Bad request
        401:
          description: Unauthorized
        404:
          description: Not found
        500:
          description: Internal server error
      security:
        -
          AdminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                password_hash:
                  type: string
              required:
                - password
                - password_hash
            example:
              password: sample_string
              password_hash: sample_string
  /admin/auth/login:
