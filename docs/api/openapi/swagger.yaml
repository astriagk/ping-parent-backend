openapi: 3.0.3
info:
  title: Ping Parent API
  description: |
    Backend service for the **Ping Parent** application - A comprehensive school transportation management system.

    ## Features
    - Parent and Driver registration and authentication
    - Student management
    - Driver-Student assignment and approval workflow
    - Trip management and tracking
    - QR/OTP based attendance system
    - Real-time notifications
    - Subscription and payment management
    - Rating and review system
    - Comprehensive admin portal
    - Audit logging

    ## Authentication
    This API uses JWT (JSON Web Tokens) for authentication. Include the token in the Authorization header:
    ```
    Authorization: Bearer <your_token>
    ```
  version: 1.0.0
  contact:
    name: API Support
    email: support@pingparent.com

servers:
  - url: http://localhost:3000/api
    description: Local development server
  - url: https://api.pingparent.com/api
    description: Production server

tags:
  - name: Authentication & User Management
    description: User registration, login, OTP verification, and profile management
  - name: Parent APIs
    description: Parent profile and address management
  - name: Driver APIs
    description: Driver profile, documents, and availability management
  - name: Student APIs
    description: Student CRUD operations (Parent only)
  - name: School APIs
    description: School management
  - name: Assignment & Trip APIs
    description: Driver-Student assignments and trip management
  - name: Attendance & QR/OTP APIs
    description: QR code/OTP generation and attendance marking
  - name: Notification APIs
    description: User notifications
  - name: Subscription & Payment APIs
    description: Subscription plans and payment processing
  - name: Ratings & Reviews APIs
    description: Driver ratings and reviews
  - name: Support & Audit APIs
    description: Audit logs and support tickets
  - name: Admin Portal APIs
    description: Admin authentication and management operations
  - name: Role Management
    description: Role CRUD operations

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for authenticated requests

  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Error message"
        error:
          type: object

    Success:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: object

    # Authentication Schemas
    RegisterSendOTP:
      type: object
      required:
        - phone
        - role
      properties:
        phone:
          type: string
          pattern: '^\+?[1-9]\d{1,14}$'
          example: "+1234567890"
        role:
          type: string
          enum: [parent, driver]
          example: "parent"

    RegisterVerifyOTP:
      type: object
      required:
        - phone
        - otp
        - name
      properties:
        phone:
          type: string
          example: "+1234567890"
        otp:
          type: string
          minLength: 6
          maxLength: 6
          example: "123456"
        name:
          type: string
          minLength: 2
          example: "John Doe"
        email:
          type: string
          format: email
          example: "john@example.com"

    LoginSendOTP:
      type: object
      required:
        - phone
      properties:
        phone:
          type: string
          example: "+1234567890"

    LoginVerifyOTP:
      type: object
      required:
        - phone
        - otp
      properties:
        phone:
          type: string
          example: "+1234567890"
        otp:
          type: string
          minLength: 6
          maxLength: 6
          example: "123456"

    User:
      type: object
      properties:
        _id:
          type: string
        phone:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    # Parent Schemas
    ParentProfile:
      type: object
      properties:
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          format: email
          example: "john@example.com"
        alternate_phone:
          type: string
          example: "+9876543210"

    ParentAddress:
      type: object
      properties:
        street:
          type: string
          example: "123 Main St"
        city:
          type: string
          example: "New York"
        state:
          type: string
          example: "NY"
        zip_code:
          type: string
          example: "10001"
        coordinates:
          type: object
          properties:
            latitude:
              type: number
              example: 40.7128
            longitude:
              type: number
              example: -74.0060

    # Driver Schemas
    DriverProfile:
      type: object
      properties:
        name:
          type: string
          example: "Jane Smith"
        email:
          type: string
          format: email
        alternate_phone:
          type: string
        license_number:
          type: string
          example: "DL123456"
        vehicle_number:
          type: string
          example: "ABC-1234"
        vehicle_type:
          type: string
          example: "Sedan"
        vehicle_model:
          type: string
          example: "Toyota Camry"
        is_available:
          type: boolean
          example: true

    DriverDocument:
      type: object
      properties:
        document_type:
          type: string
          enum: [license, vehicle_registration, insurance, background_check]
        document_url:
          type: string
          format: uri
        expiry_date:
          type: string
          format: date
        is_verified:
          type: boolean

    DriverAvailability:
      type: object
      required:
        - is_available
      properties:
        is_available:
          type: boolean
          example: true

    # Student Schemas
    Student:
      type: object
      required:
        - name
        - school_id
        - grade
      properties:
        student_id:
          type: string
          example: "STU001"
        name:
          type: string
          example: "Emily Johnson"
        school_id:
          type: string
        grade:
          type: string
          example: "5th Grade"
        section:
          type: string
          example: "A"
        age:
          type: number
          example: 10
        gender:
          type: string
          enum: [male, female, other]
        parent_id:
          type: string
        is_active:
          type: boolean
          example: true

    # School Schemas
    School:
      type: object
      required:
        - school_id
        - name
      properties:
        school_id:
          type: string
          example: "SCH001"
        name:
          type: string
          example: "Springfield Elementary"
        address:
          type: object
          properties:
            street:
              type: string
            city:
              type: string
            state:
              type: string
            zip_code:
              type: string
        phone:
          type: string
        email:
          type: string
          format: email
        is_active:
          type: boolean

    # Assignment Schemas
    DriverStudentAssignment:
      type: object
      required:
        - student_id
        - driver_id
      properties:
        student_id:
          type: string
        driver_id:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected, deactivated]
          example: "pending"
        trip_type:
          type: string
          enum: [pickup, drop, both]
          example: "both"
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date

    # Trip Schemas
    Trip:
      type: object
      required:
        - trip_type
        - scheduled_date
      properties:
        trip_type:
          type: string
          enum: [pickup, drop]
          example: "pickup"
        scheduled_date:
          type: string
          format: date
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        status:
          type: string
          enum: [scheduled, in_progress, completed, cancelled]
          example: "scheduled"
        driver_id:
          type: string
        route_details:
          type: object

    TripStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [scheduled, in_progress, completed, cancelled]

    TripStudent:
      type: object
      properties:
        trip_id:
          type: string
        student_id:
          type: string
        attendance_status:
          type: string
          enum: [present, absent, pending]
        pickup_status:
          type: string
          enum: [picked, not_picked, pending]
        pickup_time:
          type: string
          format: date-time
        drop_time:
          type: string
          format: date-time
        sequence_order:
          type: number

    AttendanceMarkRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [present, absent]
        remarks:
          type: string

    PickupRecordRequest:
      type: object
      required:
        - pickup_time
      properties:
        pickup_time:
          type: string
          format: date-time
        location:
          type: object
          properties:
            latitude:
              type: number
            longitude:
              type: number

    DropRecordRequest:
      type: object
      required:
        - drop_time
      properties:
        drop_time:
          type: string
          format: date-time
        location:
          type: object
          properties:
            latitude:
              type: number
            longitude:
              type: number

    # QR/OTP Schemas
    GenerateQrOtp:
      type: object
      required:
        - student_id
        - trip_id
      properties:
        student_id:
          type: string
        trip_id:
          type: string

    VerifyQrOtp:
      type: object
      required:
        - student_id
        - trip_id
        - code
      properties:
        student_id:
          type: string
        trip_id:
          type: string
        code:
          type: string
          example: "123456"
        type:
          type: string
          enum: [qr, otp]
          example: "otp"

    QrOtpResponse:
      type: object
      properties:
        student_id:
          type: string
        trip_id:
          type: string
        qr_code:
          type: string
        otp:
          type: string
        expires_at:
          type: string
          format: date-time

    # Notification Schemas
    Notification:
      type: object
      properties:
        _id:
          type: string
        user_id:
          type: string
        title:
          type: string
        message:
          type: string
        type:
          type: string
          enum: [trip, payment, assignment, general]
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time

    # Subscription & Payment Schemas
    SubscriptionPlan:
      type: object
      properties:
        _id:
          type: string
        plan_id:
          type: string
        name:
          type: string
          example: "Monthly Plan"
        description:
          type: string
        price:
          type: number
          example: 99.99
        duration_days:
          type: number
          example: 30
        features:
          type: array
          items:
            type: string
        is_active:
          type: boolean

    ParentSubscription:
      type: object
      required:
        - plan_id
      properties:
        plan_id:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        status:
          type: string
          enum: [active, cancelled, expired]
        auto_renew:
          type: boolean

    Payment:
      type: object
      required:
        - amount
        - subscription_id
      properties:
        subscription_id:
          type: string
        amount:
          type: number
          example: 99.99
        payment_method:
          type: string
          enum: [card, upi, bank_transfer, cash]
        transaction_id:
          type: string
        status:
          type: string
          enum: [pending, completed, failed, refunded]
        payment_date:
          type: string
          format: date-time

    # Rating & Review Schemas
    RatingReview:
      type: object
      required:
        - driver_id
        - rating
      properties:
        driver_id:
          type: string
        rating:
          type: number
          minimum: 1
          maximum: 5
          example: 4.5
        review:
          type: string
          example: "Great driver, very punctual!"
        trip_id:
          type: string

    DriverRating:
      type: object
      properties:
        driver_id:
          type: string
        average_rating:
          type: number
        total_reviews:
          type: number
        rating_breakdown:
          type: object
          properties:
            5:
              type: number
            4:
              type: number
            3:
              type: number
            2:
              type: number
            1:
              type: number

    # Admin Schemas
    AdminLogin:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: "admin"
        password:
          type: string
          format: password
          example: "password123"

    CreateAdmin:
      type: object
      required:
        - username
        - password
        - name
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        name:
          type: string
        email:
          type: string
          format: email

    UpdateAdmin:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        is_active:
          type: boolean

    # Role Schemas
    Role:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "Super Admin"
        description:
          type: string
        permissions:
          type: array
          items:
            type: string
        is_active:
          type: boolean

    # Audit Log Schemas
    AuditLog:
      type: object
      properties:
        _id:
          type: string
        user_id:
          type: string
        action:
          type: string
        resource:
          type: string
        resource_id:
          type: string
        changes:
          type: object
        ip_address:
          type: string
        user_agent:
          type: string
        timestamp:
          type: string
          format: date-time

paths:
  # ==================== Authentication & User Management ====================
  /auth/roles:
    get:
      tags:
        - Authentication & User Management
      summary: Get all available roles
      description: Retrieve list of all user roles in the system
      responses:
        '200':
          description: Roles retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'

  /auth/register/send-otp:
    post:
      tags:
        - Authentication & User Management
      summary: Send OTP for registration
      description: Send OTP to phone number for new user registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterSendOTP'
      responses:
        '200':
          description: OTP sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/register/verify-otp:
    post:
      tags:
        - Authentication & User Management
      summary: Verify OTP and complete registration
      description: Verify OTP and create new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterVerifyOTP'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      token:
                        type: string
        '400':
          description: Invalid OTP or request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login/send-otp:
    post:
      tags:
        - Authentication & User Management
      summary: Send OTP for login
      description: Send OTP to registered phone number for login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginSendOTP'
      responses:
        '200':
          description: OTP sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login/verify-otp:
    post:
      tags:
        - Authentication & User Management
      summary: Verify OTP and login
      description: Verify OTP and authenticate user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginVerifyOTP'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      token:
                        type: string
        '400':
          description: Invalid OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/verify-token:
    get:
      tags:
        - Authentication & User Management
      summary: Verify JWT token
      description: Verify if the provided JWT token is valid
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags:
        - Authentication & User Management
      summary: Logout user
      description: Logout and invalidate current session
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'

  /auth/admin/users:
    get:
      tags:
        - Authentication & User Management
      summary: Get all users (Admin only)
      description: Retrieve list of all users in the system
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: role
          schema:
            type: string
            enum: [parent, driver]
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/admin/users/{id}/activate:
    patch:
      tags:
        - Authentication & User Management
      summary: Activate user (Admin only)
      description: Activate a deactivated user account
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User activated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/admin/users/{id}/deactivate:
    patch:
      tags:
        - Authentication & User Management
      summary: Deactivate user (Admin only)
      description: Deactivate an active user account
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User deactivated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ==================== Parent APIs ====================
  /parent/profile:
    get:
      tags:
        - Parent APIs
      summary: Get parent profile
      description: Retrieve authenticated parent's profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ParentProfile'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Parent APIs
      summary: Update parent profile
      description: Update authenticated parent's profile information
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParentProfile'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /parent/address:
    get:
      tags:
        - Parent APIs
      summary: Get parent address
      description: Retrieve authenticated parent's address
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Address retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ParentAddress'

    put:
      tags:
        - Parent APIs
      summary: Update parent address
      description: Update authenticated parent's address
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParentAddress'
      responses:
        '200':
          description: Address updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'

  # ==================== Driver APIs ====================
  /driver/profile:
    get:
      tags:
        - Driver APIs
      summary: Get driver profile
      description: Retrieve authenticated driver's profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/DriverProfile'

    post:
      tags:
        - Driver APIs
      summary: Create driver profile
      description: Create a new driver profile (first-time setup)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverProfile'
      responses:
        '201':
          description: Profile created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'

    put:
      tags:
        - Driver APIs
      summary: Update driver profile
      description: Update authenticated driver's profile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverProfile'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'

  /driver/availability:
    patch:
      tags:
        - Driver APIs
      summary: Set driver availability
      description: Update driver's availability status
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverAvailability'
      responses:
        '200':
          description: Availability updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'

  /driver/address:
    get:
      tags:
        - Driver APIs
      summary: Get driver address
      description: Retrieve authenticated driver's address
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Address retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'

    post:
      tags:
