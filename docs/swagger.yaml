            schema:
              $ref: '#/components/schemas/DriverDocumentRequest'
      responses:
        '200':
          description: Documents created/updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
