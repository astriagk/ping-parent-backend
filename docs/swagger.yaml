          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /driver/documents:
    get:
      tags:
        - Driver
      summary: Get driver documents
      description: Get authenticated driver's document information
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
