                  data:
                    $ref: '#/components/schemas/DriverDocument'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Documents not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Driver
      summary: Create driver documents
      description: Create or fully update driver's document information
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
