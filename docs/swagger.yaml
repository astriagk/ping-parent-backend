                error: "QR code/OTP already generated for this trip and student"

  /daily-qr-otp/student/{studentId}/trip/{tripId}:
    get:
      tags:
        - Daily QR/OTP
      summary: Get QR/OTP by student and trip
      description: Retrieve the QR code and OTP for a specific student and trip combination
      security:
        - BearerAuth: []
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
          description: Student ID (e.g., STUz5W2n8Ks)
          example: "STUz5W2n8Ks"
        - name: tripId
          in: path
          required: true
          schema:
            type: string
          description: Trip ID (e.g., TRPx7Y3m9Pq)
          example: "TRPx7Y3m9Pq"
      responses:
        '200':
          description: QR code/OTP fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/DailyQrOtp'
                  message:
                    type: string
                    example: "QR code/OTP fetched successfully"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: QR code/OTP not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                error: "QR code/OTP not found"

  /daily-qr-otp/verify:
    post:
      tags:
        - Daily QR/OTP
      summary: Verify QR code or OTP
      description: |
        Verify a QR code or OTP. Either qr_code or otp_code must be provided (not both required).
        The code will be marked as used after successful verification.

        Validation checks:
        - Code must not be already used
        - Code must be within validity period (valid_from to valid_until)
        - Code must match an existing record
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyQrOtpRequest'
            examples:
              qrCode:
                summary: Verify with QR code
                value:
                  qr_code: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAA..."
              otpCode:
                summary: Verify with OTP
                value:
                  otp_code: "123456"
      responses:
        '200':
          description: QR code/OTP verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/DailyQrOtp'
                  message:
                    type: string
                    example: "QR code/OTP verified successfully"
        '400':
          description: Bad request - validation error or QR/OTP already used/expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                alreadyUsed:
                  summary: QR/OTP already used
                  value:
                    success: false
                    error: "QR code/OTP has already been used"
                expired:
                  summary: QR/OTP expired
                  value:
                    success: false
                    error: "QR code/OTP has expired"
                notValidYet:
                  summary: QR/OTP not valid yet
                  value:
                    success: false
                    error: "QR code/OTP is not valid yet"
                missingBoth:
                  summary: Neither QR code nor OTP provided
                  value:
                    success: false
                    error: "Either QR code or OTP is required"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Invalid QR code or OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                error: "Invalid QR code or OTP"

