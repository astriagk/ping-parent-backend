        - `city`: Filter schools by city name
        - `state`: Filter schools by state name
        - `search`: Search schools by name (partial match)
      security:
        - BearerAuth: []
      parameters:
        - name: city
          in: query
          required: false
          schema:
            type: string
          description: Filter by city name
          example: "Springfield"
        - name: state
          in: query
          required: false
          schema:
            type: string
          description: Filter by state name
          example: "Illinois"
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search schools by name (partial match)
          example: "elementary"
      responses:
