  # Student Endpoints
  /students:
    post:
      tags:
        - Student
      summary: Create student
      description: |
        Create a new student record for the authenticated parent.

        **Important**: The `parent_id` is automatically derived from the authenticated user's JWT token.
        Do not include `parent_id` in the request body - it will be ignored if provided.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStudentRequest'
      responses:
        '201':
          description: Student created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Student'
        '400':
          description: Bad request - validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Duplicate student - same name, school, and class exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                error: "A student with the same name, school, and class already exists for this parent"

