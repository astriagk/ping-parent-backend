        - Daily QR/OTP
      summary: Generate QR code and OTP
      description: |
        Generate a QR code and OTP for a student's trip. Each student-trip combination can only have one active QR/OTP.
        The QR code is valid for 24 hours from generation.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateQrOtpRequest'
      responses:
