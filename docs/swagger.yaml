openapi: 3.0.3
info:
  title: Ping Parent Backend API
  description: |
    Complete API documentation for the Ping Parent application backend.

    ## Authentication
    Most endpoints require authentication using Bearer tokens. Include the token in the Authorization header:
    ```
    Authorization: Bearer <your_token_here>
    ```
    
  version: 1.0.0

servers:
  - url: http://localhost:3000/api
    description: Local development server
  - url: https://staging-api.pingparent.com/api
    description: Staging server
  - url: https://api.pingparent.com/api
    description: Production server

tags:
  - name: Authentication
    description: User authentication and authorization endpoints
  - name: Parent
    description: Parent profile and address management
  - name: Driver
    description: Driver profile and document management
  - name: School
    description: School management endpoints
  - name: Student
    description: Student management endpoints
  - name: Driver-Student Assignment
    description: Driver and student assignment management
  - name: Trip
    description: Trip management for drivers
  - name: Trip Student
    description: Trip student attendance and pickup/drop tracking
  - name: Daily QR/OTP
    description: Daily QR code and OTP generation and verification for student trips
  - name: Notification
    description: User notification management endpoints
  - name: Subscription Plan
    description: Subscription plan management endpoints (read-only)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for authentication

  schemas:
    # Common Schemas
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Error message"
        details:
          type: array
          items:
            type: string

    Success:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: object

    # Authentication Schemas
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - firstName
        - lastName
        - role
      properties:
        email:
          type: string
          format: email
          example: "parent@example.com"
        password:
          type: string
          minLength: 8
          example: "SecurePass123"
        firstName:
          type: string
          example: "John"
        lastName:
          type: string
          example: "Doe"
        role:
          type: string
          enum: [parent, driver]
          example: "parent"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "parent@example.com"
        password:
          type: string
          example: "SecurePass123"

    PhoneOTPRequest:
      type: object
      required:
        - phone
      properties:
        phone:
          type: string
          pattern: '^\+?[0-9]{10,15}$'
          example: "+1234567890"
        role:
          type: string
          enum: [parent, driver]
          example: "parent"

    VerifyOTPRequest:
      type: object
      required:
        - phone
        - otp
      properties:
        phone:
          type: string
          example: "+1234567890"
        otp:
          type: string
          minLength: 6
          maxLength: 6
          example: "123456"

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Login successful"
        data:
          type: object
          properties:
            accessToken:
              type: string
            refreshToken:
              type: string
            user:
              $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        _id:
          type: string
          example: "507f1f77bcf86cd799439011"
        user_id:
          type: string
          example: "V1StGXR8_Z5jdHi6B"
        phone_number:
          type: string
          example: "+1234567890"
        email:
          type: string
          example: "parent@example.com"
        user_type:
          type: string
          enum: [parent, driver, admin]
          example: "parent"
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # Parent Schemas
    Parent:
      type: object
      properties:
        _id:
          type: string
        parent_id:
          type: string
        user_id:
          type: string
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          example: "parent@example.com"
        photo_url:
          type: string
          example: "https://example.com/photo.jpg"
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UpdateParentRequest:
      type: object
      properties:
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          format: email
          example: "parent@example.com"
        photo_url:
          type: string
          example: "https://example.com/photo.jpg"

    ParentAddress:
      type: object
      properties:
        _id:
          type: string
        address_id:
          type: string
        parent_id:
          type: string
        address_line1:
          type: string
        address_line2:
          type: string
        city:
          type: string
        state:
          type: string
        pincode:
          type: string
        latitude:
          type: number
          format: float
        longitude:
          type: number
          format: float
        is_primary:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ParentAddressRequest:
      type: object
      required:
        - address_line1
        - city
        - state
        - latitude
        - longitude
      properties:
        address_line1:
          type: string
          example: "123 Main Street"
          description: "Primary address line"
        address_line2:
          type: string
          example: "Apartment 4B"
          description: "Secondary address line (optional)"
        city:
          type: string
          example: "Mumbai"
          description: "City name"
        state:
          type: string
          example: "Maharashtra"
          description: "State name"
        pincode:
          type: string
          example: "400001"
          description: "Postal code (optional)"
        latitude:
          type: number
          format: float
          example: 19.0760
          description: "Latitude coordinate"
        longitude:
          type: number
          format: float
          example: 72.8777
          description: "Longitude coordinate"
        is_primary:
          type: boolean
          example: true
          description: "Whether this is the primary address (optional, defaults to true)"

    # Driver Schemas
    Driver:
      type: object
      properties:
        _id:
          type: string
        driver_id:
          type: string
        user_id:
          type: string
        driver_unique_id:
          type: string
        name:
          type: string
        email:
          type: string
        photo_url:
          type: string
        vehicle_type:
          type: string
          enum: [van, auto, bus]
        vehicle_number:
          type: string
        vehicle_capacity:
          type: integer
        current_student_count:
          type: integer
        approval_status:
          type: string
          enum: [pending, approved, rejected]
        approved_by:
          type: string
        approved_at:
          type: string
          format: date-time
        rejection_reason:
          type: string
        is_available:
          type: boolean
        rating:
          type: number
          format: float
        total_trips:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        user:
          type: object
          properties:
            phone_number:
              type: string
            user_type:
              type: string
            is_active:
              type: boolean
            fcm_token:
              type: string
            last_login:
              type: string
              format: date-time

    CreateDriverRequest:
      type: object
      required:
        - name
        - vehicle_type
        - vehicle_number
        - vehicle_capacity
      properties:
        name:
          type: string
          example: "Jane Driver"
          description: "Driver's full name"
        email:
          type: string
          format: email
          example: "jane@example.com"
          description: "Driver's email address (optional)"
        photo_url:
          type: string
          example: "https://example.com/photo.jpg"
          description: "URL to driver's profile photo (optional)"
        vehicle_type:
          type: string
          enum: [van, auto, bus]
          example: "van"
          description: "Type of vehicle"
        vehicle_number:
          type: string
          example: "ABC-1234"
          description: "Vehicle registration number"
        vehicle_capacity:
          type: integer
          example: 10
          description: "Maximum number of students the vehicle can accommodate"
        is_available:
          type: boolean
          example: true
          description: "Whether the driver is currently available (optional, defaults to true)"

    DriverAddress:
      type: object
      properties:
        _id:
          type: string
        address_id:
          type: string
        driver_id:
          type: string
        address_line1:
          type: string
        address_line2:
          type: string
        city:
          type: string
        state:
          type: string
        pincode:
          type: string
        latitude:
          type: number
          format: float
        longitude:
          type: number
          format: float
        is_primary:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DriverAddressRequest:
      type: object
      required:
        - address_line1
        - city
        - state
        - latitude
        - longitude
      properties:
        address_line1:
          type: string
          example: "123 Main Street"
          description: "Primary address line"
        address_line2:
          type: string
          example: "Apartment 4B"
          description: "Secondary address line (optional)"
        city:
          type: string
          example: "Mumbai"
          description: "City name"
        state:
          type: string
          example: "Maharashtra"
          description: "State name"
        pincode:
          type: string
          example: "400001"
          description: "Postal code (optional)"
        latitude:
          type: number
          format: float
          example: 19.0760
          description: "Latitude coordinate"
        longitude:
          type: number
          format: float
          example: 72.8777
          description: "Longitude coordinate"
        is_primary:
          type: boolean
          example: true
          description: "Whether this is the primary address (optional, defaults to true)"

    DriverDocument:
      type: object
      properties:
        _id:
          type: string
        document_id:
          type: string
        driver_id:
          type: string
        driving_license_number:
          type: string
        driving_license_photo_url:
          type: string
        vehicle_license_number:
          type: string
        vehicle_license_photo_url:
          type: string
        insurance_number:
          type: string
        insurance_photo_url:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DriverDocumentRequest:
      type: object
      required:
        - driving_license_number
        - vehicle_license_number
      properties:
        driving_license_number:
          type: string
          example: "DL-123456789"
          description: "Driving license number"
        driving_license_photo_url:
          type: string
          example: "https://example.com/dl-photo.jpg"
          description: "URL to driving license photo (optional)"
        vehicle_license_number:
          type: string
          example: "VL-987654321"
          description: "Vehicle license/registration number"
        vehicle_license_photo_url:
          type: string
          example: "https://example.com/vl-photo.jpg"
          description: "URL to vehicle license photo (optional)"
        insurance_number:
          type: string
          example: "INS-456789123"
          description: "Insurance policy number (optional)"
        insurance_photo_url:
          type: string
          example: "https://example.com/ins-photo.jpg"
          description: "URL to insurance document photo (optional)"

    DriverDocumentUpdateRequest:
      type: object
      properties:
        driving_license_number:
          type: string
          example: "DL-123456789"
          description: "Driving license number"
        driving_license_photo_url:
          type: string
          example: "https://example.com/dl-photo.jpg"
          description: "URL to driving license photo"
        vehicle_license_number:
          type: string
          example: "VL-987654321"
          description: "Vehicle license/registration number"
        vehicle_license_photo_url:
          type: string
          example: "https://example.com/vl-photo.jpg"
          description: "URL to vehicle license photo"
        insurance_number:
          type: string
          example: "INS-456789123"
          description: "Insurance policy number"
        insurance_photo_url:
          type: string
          example: "https://example.com/ins-photo.jpg"
          description: "URL to insurance document photo"

    # School Schemas
    School:
      type: object
      properties:
        school_id:
          type: string
          example: "W2TuHYS9_A6keIj7C"
          description: "Unique school identifier"
        school_name:
          type: string
          example: "Springfield Elementary School"
          description: "Name of the school"
        address:
          type: string
          example: "742 Evergreen Terrace, Springfield"
          description: "Full address of the school"
        city:
          type: string
          example: "Springfield"
          description: "City where the school is located"
        state:
          type: string
          example: "Illinois"
          description: "State where the school is located"
        latitude:
          type: number
          format: double
          example: 39.7817
          description: "Latitude coordinate of school location"
        longitude:
          type: number
          format: double
          example: -89.6501
          description: "Longitude coordinate of school location"
        contact_number:
          type: string
          example: "+1234567890"
          description: "School contact number"
        email:
          type: string
          format: email
          example: "admin@springfield-school.edu"
          description: "School email address"
        created_at:
          type: string
          format: date-time
          description: "Timestamp when school was created"
        updated_at:
          type: string
          format: date-time
          description: "Timestamp when school was last updated"

    CreateSchoolRequest:
      type: object
      required:
        - school_name
        - address
        - city
        - state
        - latitude
        - longitude
      properties:
        school_name:
          type: string
          minLength: 3
          maxLength: 200
          example: "Springfield Elementary School"
          description: "Name of the school (3-200 characters)"
        address:
          type: string
          maxLength: 255
          example: "742 Evergreen Terrace, Springfield"
          description: "Full address of the school"
        city:
          type: string
          maxLength: 100
          example: "Springfield"
          description: "City name"
        state:
          type: string
          maxLength: 100
          example: "Illinois"
          description: "State name"
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 39.7817
          description: "Latitude coordinate (-90 to 90)"
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: -89.6501
          description: "Longitude coordinate (-180 to 180)"
        contact_number:
          type: string
          pattern: '^\+?[0-9]{10,15}$'
          example: "+1234567890"
          description: "School contact number (optional, 10-15 digits)"
        email:
          type: string
          format: email
          example: "admin@springfield-school.edu"
          description: "School email address (optional)"

    UpdateSchoolRequest:
      type: object
      properties:
        school_name:
          type: string
          minLength: 3
          maxLength: 200
          example: "Springfield Elementary School"
          description: "Name of the school (3-200 characters)"
        address:
          type: string
          maxLength: 255
          example: "742 Evergreen Terrace, Springfield"
          description: "Full address of the school"
        city:
          type: string
          maxLength: 100
          example: "Springfield"
          description: "City name"
        state:
          type: string
          maxLength: 100
          example: "Illinois"
          description: "State name"
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 39.7817
          description: "Latitude coordinate (-90 to 90)"
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: -89.6501
          description: "Longitude coordinate (-180 to 180)"
        contact_number:
          type: string
          pattern: '^\+?[0-9]{10,15}$'
          example: "+1234567890"
          description: "School contact number (10-15 digits)"
        email:
          type: string
          format: email
          example: "admin@springfield-school.edu"
          description: "School email address"

    # Student Schemas
    Student:
      type: object
      properties:
        _id:
          type: string
        student_id:
          type: string
        parent_id:
          type: string
        school_id:
          type: string
        student_name:
          type: string
        class:
          type: string
        section:
          type: string
        roll_number:
          type: string
        photo_url:
          type: string
        date_of_birth:
          type: string
          format: date
        gender:
          type: string
          enum: [male, female, other]
        pickup_address_id:
          type: string
        emergency_contact:
          type: string
        medical_info:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateStudentRequest:
      type: object
      required:
        - school_id
        - student_name
        - class
        - pickup_address_id
      properties:
        school_id:
          type: string
          example: "W2TuHYS9_A6keIj7C"
          description: "School ID where the student is enrolled"
        student_name:
          type: string
          minLength: 2
          maxLength: 100
          example: "Emma Johnson"
          description: "Student's full name"
        class:
          type: string
          example: "5"
          description: "Student's class/grade"
        section:
          type: string
          example: "A"
          description: "Student's section/division (optional)"
        roll_number:
          type: string
          example: "25"
          description: "Student's roll number (optional)"
        photo_url:
          type: string
          description: "URL to student's photo (optional)"
        date_of_birth:
          type: string
          format: date
          description: "Student's date of birth (optional)"
        gender:
          type: string
          enum: [male, female, other]
          description: "Student's gender (optional)"
        pickup_address_id:
          type: string
          description: "Address ID for student pickup location"
        emergency_contact:
          type: string
          pattern: '^\+?[0-9]{10,15}$'
          description: "Emergency contact phone number (optional)"
        medical_info:
          type: string
          maxLength: 500
          description: "Medical information or notes (optional)"
      description: "Note: parent_id is automatically derived from the authenticated user's JWT token and should not be included in the request"

    UpdateStudentRequest:
      type: object
      properties:
        student_name:
          type: string
          minLength: 2
          maxLength: 100
        class:
          type: string
        section:
          type: string
        roll_number:
          type: string
        photo_url:
          type: string
        date_of_birth:
          type: string
          format: date
        gender:
          type: string
          enum: [male, female, other]
        pickup_address_id:
          type: string
        emergency_contact:
          type: string
          pattern: '^\+?[0-9]{10,15}$'
        medical_info:
          type: string
          maxLength: 500

    # Driver-Student Assignment Schemas
    DriverStudentAssignment:
      type: object
      properties:
        _id:
          type: string
          description: MongoDB ObjectId
        assignment_id:
          type: string
          description: Unique assignment identifier with DSA prefix
          example: "DSAx7Y3m9Pq"
        driver_id:
          type: string
          description: Driver's MongoDB ObjectId
        student_id:
          type: string
          description: Student's MongoDB ObjectId
        driver_unique_id:
          type: string
          description: Driver's unique identifier for parent search
          example: "DRV123456"
        monthly_fee:
          type: number
          format: decimal
          description: Monthly fee for the service
          example: 5000.00
        assignment_status:
          type: string
          enum: [active, inactive, pending, parent_requested, rejected]
          description: Assignment status
          example: "active"
        assigned_date:
          type: string
          format: date
          description: Date when assignment was created
        start_date:
          type: string
          format: date
          description: Assignment start date
        end_date:
          type: string
          format: date
          description: Assignment end date
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateDriverStudentAssignmentRequest:
      type: object
      required:
        - student_id
        - driver_unique_id
        - assigned_date
      properties:
        student_id:
          type: string
          description: Student's MongoDB ObjectId
          example: "507f1f77bcf86cd799439014"
        driver_unique_id:
          type: string
          maxLength: 20
          description: Driver's unique identifier
          example: "DRV123456"
        monthly_fee:
          type: number
          format: decimal
          minimum: 0
          description: Monthly fee (optional)
          example: 5000.00
        assigned_date:
          type: string
          format: date
          description: Date when assignment is created
          example: "2024-01-20"
        start_date:
          type: string
          format: date
          description: Assignment start date (optional)
          example: "2024-02-01"
        end_date:
          type: string
          format: date
          description: Assignment end date (optional)
          example: "2024-12-31"
      description: "Note: driver_id is automatically derived from authenticated user for drivers, or looked up by driver_unique_id for parents"

    UpdateDriverStudentAssignmentRequest:
      type: object
      properties:
        monthly_fee:
          type: number
          format: decimal
          minimum: 0
          description: Updated monthly fee
        assignment_status:
          type: string
          enum: [active, inactive, pending, parent_requested, rejected]
          description: Updated assignment status
        start_date:
          type: string
          format: date
          description: Updated start date
        end_date:
          type: string
          format: date
          description: Updated end date

    # Trip Schemas
    Trip:
      type: object
      properties:
        _id:
          type: string
          description: MongoDB ObjectId
        trip_id:
          type: string
          description: Unique trip identifier with TRP prefix
          example: "TRPa2B9k4Lm"
        driver_id:
          type: string
          description: Driver's MongoDB ObjectId
        school_id:
          type: string
          description: School's MongoDB ObjectId
        trip_type:
          type: string
          enum: [pickup, drop]
          description: Type of trip
          example: "pickup"
        trip_date:
          type: string
          format: date-time
          description: Trip date
        trip_status:
          type: string
          enum: [scheduled, started, in_progress, completed, cancelled]
          description: Current trip status
          example: "scheduled"
        start_time:
          type: string
          format: date-time
          description: Trip start time
        end_time:
          type: string
          format: date-time
          description: Trip end time
        total_distance:
          type: number
          format: decimal
          description: Total distance in kilometers
          example: 15.5
        optimized_route_data:
          type: object
          description: Calculated optimal route data (JSON)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateTripRequest:
      type: object
      required:
        - school_id
        - trip_type
        - trip_date
      properties:
        school_id:
          type: string
          description: School's MongoDB ObjectId
          example: "507f1f77bcf86cd799439011"
        trip_type:
          type: string
          enum: [pickup, drop]
          description: Type of trip
          example: "pickup"
        trip_date:
          type: string
          format: date-time
          description: Trip date
          example: "2024-01-22T00:00:00.000Z"
      description: |
        Note: The following fields are automatically managed and should NOT be included in the request:
        - driver_id: Automatically derived from authenticated driver
        - trip_status: Automatically set to 'scheduled' on creation
        - start_time and end_time: Managed by status transitions
        - total_distance: System-calculated from route data
        - optimized_route_data: System-calculated based on student locations

    UpdateTripRequest:
      type: object
      properties:
        school_id:
          type: string
          description: Updated school ID
        trip_type:
          type: string
          enum: [pickup, drop]
          description: Updated trip type
        trip_date:
          type: string
          format: date-time
          description: Updated trip date
      description: |
        Note: The following fields are NOT updatable via this endpoint:
        - trip_status: Use PATCH /trips/:id/status endpoint instead
        - start_time and end_time: Managed automatically by status transitions
        - total_distance: System-calculated from route data
        - optimized_route_data: System-calculated based on student locations

    UpdateTripStatusRequest:
      type: object
      required:
        - trip_status
      properties:
        trip_status:
          type: string
          enum: [scheduled, started, in_progress, completed, cancelled]
          description: New trip status
          example: "started"

    # Trip Student Schemas
    TripStudent:
      type: object
      properties:
        _id:
          type: string
          description: MongoDB internal ID
        trip_student_id:
          type: string
          description: Unique trip student identifier
          example: "TPSa2B9k4Lm"
        trip_id:
          type: string
          description: Trip's ID
          example: "TRPx7Y3m9Pq"
        student_id:
          type: string
          description: Student's ID
          example: "STUz5W2n8Ks"
        sequence_order:
          type: integer
          description: Optimized pickup/drop order (system calculated)
          example: 2
        estimated_arrival_time:
          type: string
          format: time
          description: Calculated ETA (system calculated)
          example: "08:15:00"
        attendance_status:
          type: string
          enum: [present, absent, pending]
          description: Student attendance status
          example: "present"
        pickup_status:
          type: string
          enum: [pending, picked, dropped, no_show]
          description: Pickup/drop status
          example: "picked"
        pickup_time:
          type: string
          format: date-time
          description: Actual pickup time
        pickup_latitude:
          type: number
          format: double
          description: Pickup location latitude
          example: 40.7128
        pickup_longitude:
          type: number
          format: double
          description: Pickup location longitude
          example: -74.0060
        pickup_qr_code:
          type: string
          maxLength: 100
          description: QR code for pickup verification
        pickup_otp:
          type: string
          pattern: '^[0-9]{6}$'
          description: OTP for pickup verification
        drop_time:
          type: string
          format: date-time
          description: Actual drop time
        drop_latitude:
          type: number
          format: double
          description: Drop location latitude
        drop_longitude:
          type: number
          format: double
          description: Drop location longitude
        drop_qr_code:
          type: string
          maxLength: 100
          description: QR code for drop verification
        drop_otp:
          type: string
          pattern: '^[0-9]{6}$'
          description: OTP for drop verification
        notes:
          type: string
          maxLength: 500
          description: Additional notes
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MarkAttendanceRequest:
      type: object
      required:
        - attendance_status
      properties:
        attendance_status:
          type: string
          enum: [present, absent, pending]
          description: Attendance status
          example: "present"
        notes:
          type: string
          maxLength: 500
          description: Optional notes
          example: "Student present at pickup location"
      description: |
        Mark student attendance for a trip.
        Note: sequence_order and estimated_arrival_time are system-calculated and should NOT be included.

    RecordPickupRequest:
      type: object
      properties:
        pickup_latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Pickup location latitude
          example: 40.7128
        pickup_longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Pickup location longitude
          example: -74.0060
        pickup_qr_code:
          type: string
          maxLength: 100
          description: QR code scanned during pickup
        pickup_otp:
          type: string
          pattern: '^[0-9]{6}$'
          description: OTP verified during pickup
          example: "123456"
        notes:
          type: string
          maxLength: 500
          description: Optional pickup notes
          example: "Student picked up on time"

    RecordDropRequest:
      type: object
      properties:
        drop_latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Drop location latitude
          example: 40.7580
        drop_longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Drop location longitude
          example: -73.9855
        drop_qr_code:
          type: string
          maxLength: 100
          description: QR code scanned during drop
        drop_otp:
          type: string
          pattern: '^[0-9]{6}$'
          description: OTP verified during drop
          example: "654321"
        notes:
          type: string
          maxLength: 500
          description: Optional drop notes
          example: "Student dropped off at school entrance"

    UpdateTripStudentRequest:
      type: object
      properties:
        attendance_status:
          type: string
          enum: [present, absent, pending]
          description: Updated attendance status
        pickup_status:
          type: string
          enum: [pending, picked, dropped, no_show]
          description: Updated pickup status
        notes:
          type: string
          maxLength: 500
          description: Updated notes

    # Daily QR/OTP Schemas
    DailyQrOtp:
      type: object
      properties:
        _id:
          type: string
          description: MongoDB internal ID
        qr_otp_id:
          type: string
          description: Unique QR/OTP identifier
          example: "DQOa3B5k7Lm9Pq2Rs4Tv6Wx8Yz1Ab3Cd"
        student_id:
          type: string
          description: Student's ID
          example: "STUz5W2n8Ks"
        trip_id:
          type: string
          description: Trip's ID
          example: "TRPx7Y3m9Pq"
        qr_code:
          type: string
          description: Base64 encoded QR code data URL
          example: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAA..."
        otp_code:
          type: string
          pattern: '^[0-9]{6}$'
          description: 6-digit OTP code
          example: "123456"
        trip_type:
          type: string
          enum: [pickup, drop]
          description: Type of trip
          example: "pickup"
        valid_from:
          type: string
          format: date-time
          description: QR/OTP validity start time
        valid_until:
          type: string
          format: date-time
          description: QR/OTP validity end time (24 hours from generation)
        is_used:
          type: boolean
          description: Whether QR/OTP has been used
          example: false
        used_at:
          type: string
          format: date-time
          description: Timestamp when QR/OTP was used
        created_at:
          type: string
          format: date-time

    GenerateQrOtpRequest:
      type: object
      required:
        - student_id
        - trip_id
        - trip_type
      properties:
        student_id:
          type: string
          description: Student's ID
          example: "STUz5W2n8Ks"
        trip_id:
          type: string
          description: Trip's ID
          example: "TRPx7Y3m9Pq"
        trip_type:
          type: string
          enum: [pickup, drop]
          description: Type of trip
          example: "pickup"

    VerifyQrOtpRequest:
      type: object
      properties:
        qr_code:
          type: string
          maxLength: 255
          description: QR code to verify (either qr_code or otp_code required)
          example: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAA..."
        otp_code:
          type: string
          pattern: '^[0-9]{6}$'
          description: OTP code to verify (either qr_code or otp_code required)
          example: "123456"
      description: |
        Either qr_code or otp_code must be provided (not both required).

    # Notification Schemas
    Notification:
      type: object
      properties:
        _id:
          type: string
          description: MongoDB internal ID
        notification_id:
          type: string
          description: Unique notification identifier
          example: "notif_abc123"
        user_id:
          type: string
          description: User's ID
          example: "user_123"
        notification_type:
          type: string
          enum: [pickup_started, approaching, picked_up, dropped, payment_due, general]
          description: Type of notification
          example: "pickup_started"
        title:
          type: string
          maxLength: 200
          description: Notification title
          example: "Trip Started"
        message:
          type: string
          description: Notification message
          example: "Your driver has started the pickup trip"
        data:
          type: object
          description: Additional notification data (JSON)
          example:
            trip_id: "trip_123"
            driver_name: "John Doe"
        is_read:
          type: boolean
          description: Whether notification has been read
          default: false
          example: false
        read_at:
          type: string
          format: date-time
          description: Timestamp when notification was read
        created_at:
          type: string
          format: date-time
          description: Notification creation timestamp

    SubscriptionPlan:
      type: object
      required:
        - plan_id
        - plan_name
        - plan_type
        - price
        - is_active
        - created_at
      properties:
        _id:
          type: string
          description: MongoDB internal ID
          example: "507f1f77bcf86cd799439011"
        plan_id:
          type: string
          description: Unique plan identifier (SPL prefix)
          example: "SPLa2B9k4Lm"
        plan_name:
          type: string
          minLength: 3
          maxLength: 100
          description: Name of the subscription plan
          example: "Monthly Basic"
        plan_type:
          type: string
          enum: [monthly, quarterly, yearly]
          description: Type of subscription plan
          example: "monthly"
        price:
          type: number
          format: double
          minimum: 0
          description: Price of the subscription plan
          example: 299.99
        features:
          type: object
          description: JSON object containing plan features
          example:
            max_students: 2
            live_tracking: true
            trip_history: "30_days"
            notifications: true
        is_active:
          type: boolean
          description: Whether the plan is active and available for purchase
          default: true
          example: true
        created_at:
          type: string
          format: date-time
          description: Plan creation timestamp
          example: "2024-01-01T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          description: Plan last update timestamp
          example: "2024-01-15T10:30:00Z"

paths:
  # Authentication Endpoints
  /auth/roles:
    get:
      tags:
        - Authentication
      summary: Get available user roles
      description: Retrieves list of available user roles in the system
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: string
                    example: ["parent", "driver", "admin"]
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/register/send-otp:
    post:
      tags:
        - Authentication
      summary: Send OTP for phone registration
      description: Send OTP to phone number for registration (Step 1 of 3)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneOTPRequest'
      responses:
        '200':
          description: OTP sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "OTP sent successfully"
        '400':
          description: Bad request - invalid phone number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Phone number already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/register/verify-otp:
    post:
      tags:
        - Authentication
      summary: Verify OTP for phone registration
      description: Verify OTP sent to phone number (Step 2 of 3)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
      responses:
        '200':
          description: OTP verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      tempToken:
                        type: string
        '400':
          description: Invalid or expired OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login/send-otp:
    post:
      tags:
        - Authentication
      summary: Send OTP for phone login
      description: Send OTP to registered phone number for login (Step 1 of 2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
              properties:
                phone:
                  type: string
                  example: "+1234567890"
      responses:
        '200':
          description: OTP sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Phone number not registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login/verify-otp:
    post:
      tags:
        - Authentication
      summary: Verify OTP for phone login
      description: Verify OTP and complete login (Step 2 of 2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid or expired OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/verify-token:
    get:
      tags:
        - Authentication
      summary: Verify authentication token
      description: Verify if the provided JWT token is valid
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      userId:
                        type: string
                      role:
                        type: string
        '401':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout user
      description: Logout and invalidate tokens
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Parent Endpoints
  /parent/profile:
    get:
      tags:
        - Parent
      summary: Get parent profile
      description: Get authenticated parent's profile information
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Parent'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Parent
      summary: Update parent profile
      description: Update authenticated parent's profile information
      security:
