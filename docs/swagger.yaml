  /trips/{id}/status:
    patch:
      tags:
        - Trip
      summary: Update trip status
      description: |
        Update the status of a trip with automatic timestamp management.

        Valid status transitions:
        - scheduled → started, cancelled
        - started → in_progress, cancelled
        - in_progress → completed, cancelled
        - completed → (no transitions allowed)
        - cancelled → (no transitions allowed)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Trip MongoDB ObjectId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTripStatusRequest'
      responses:
        '200':
          description: Trip status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Trip'
                  message:
                    type: string
                    example: "Trip status updated successfully"
        '400':
          description: Bad request - invalid status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                error: "Invalid trip status transition"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Trip not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

